<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Livros - Biblioteca</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Livros</h1>

    <form action="/livros/adicionar" method="POST">

        <input
            type="text"
            name="titulo"
            placeholder="Título do livro"
            required
        >

        <input
            type="number"
            name="ano"
            placeholder="Ano"
        >

        <select name="id_autor" required>

            <option value="">
                Selecione o autor
            </option>

            {% for autor in autores %}

            <option value="{{ autor['id_autor'] }}">
                {{ autor['nome'] }}
            </option>

            {% endfor %}

        </select>

        <button type="submit">
            Adicionar Livro
        </button>

    </form>

    <h2>Livros cadastrados</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Ano</th>
                <th>Autor</th>
                <th>Ação</th>
            </tr>

        </thead>

        <tbody>

            {% for livro in livros %}

            <tr>

                <td>{{ livro['id_livro'] }}</td>

                <td>{{ livro['titulo'] }}</td>

                <td>{{ livro['ano'] }}</td>

                <td>{{ livro['autor'] }}</td>

                <td>
                    <a href="/livros/excluir/{{ livro['id_livro'] }}">
                        Excluir
                    </a>
                </td>

            </tr>

            {% else %}

            <tr>
                <td colspan="5">
                    Nenhum livro cadastrado.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <br>

    <a href="/">Voltar ao início</a>

</div>

</body>
</html>
